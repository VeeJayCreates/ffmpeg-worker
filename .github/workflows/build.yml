name: Build FFmpeg Worker

on:
  push:
    branches: [main]
    paths:
      - 'ffmpeg-worker/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./ffmpeg-worker
          push: true
          tags: |
            ghcr.io/veejaycreates/ffmpeg-worker:latest
            ghcr.io/veejaycreates/ffmpeg-worker:v1
